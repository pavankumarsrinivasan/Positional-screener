name: NSE500 Monthly Momentum Screener

on:
  schedule:
    # Runs at 04:00 UTC (9:30 AM IST) on the 1st of every month
    - cron: '0 4 1 * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python nse500_momentum_screener.py

      - name: Commit ranked CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nse500_momentum_ranked.csv
          git diff --staged --quiet || git commit -m "Monthly momentum ranking $(date +'%Y-%m')"
          git push
